<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketBoss</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #e2e8f0; margin: 0; padding: 12px 12px 90px 12px; }
        .card { background: white; padding: 16px; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); max-width: 440px; margin: auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h2 { margin: 0; color: #0f172a; font-size: 20px; font-weight: 800; }
        .lang-btn { background: #2563eb; color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }

        input[type="radio"].nav-radio { display: none; }
        .tab-content { display: none; }

        #radio-home:checked ~ .card #screen-home { display: block; }
        #radio-prof:checked ~ .card #screen-prof { display: block; }

        /* சேமிப்பு & மொத்த கையிருப்பு கட்டங்கள் */
        .savings-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .savings-box { background: #059669; color: white; padding: 12px; border-radius: 10px; text-align: center; }
        .total-box { background: #0284c7; color: white; padding: 12px; border-radius: 10px; text-align: center; }
        .box-title { font-size: 11px; opacity: 0.9; font-weight: bold; text-transform: uppercase; }
        .box-amount { font-size: 20px; font-weight: bold; margin: 4px 0; }
        .savings-rate { font-size: 11px; background: rgba(255,255,255,0.25); padding: 2px 6px; border-radius: 8px; display: inline-block; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .dash-card { padding: 10px; border-radius: 10px; text-align: center; color: white; }
        .dash-today { background: #ea580c; }
        .dash-kadai { background: #dc2626; }

        input, select, button.add-btn { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
        button.add-btn { background: #0f172a; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 6px; }

        .history-header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .download-btn { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; width: auto; }

        ul { list-style: none; padding: 0; margin-top: 10px; max-height: 260px; overflow-y: auto; }
        li { background: #f8fafc; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; border-left: 5px solid #2563eb; display: flex; justify-content: space-between; align-items: center; }
        li.kadai-item { border-left-color: #dc2626; }
        li.repaid-item { border-left-color: #10b981; }
        .del-btn { background: #fee2e2; color: #dc2626; border: none; padding: 4px 8px; border-radius: 5px; font-weight: bold; cursor: pointer; width: auto; margin-left: 8px; }

        .profile-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .clear-btn { background: #dc2626; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid #cbd5e1; display: flex; justify-content: space-around; padding: 8px 0 14px 0; max-width: 440px; margin: auto; z-index: 99999; }
        .nav-label-btn { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 12px; font-weight: bold; cursor: pointer; width: 50%; text-align: center; -webkit-tap-highlight-color: transparent; }
        .nav-label-btn .icon { font-size: 20px; }

        #radio-home:checked ~ .bottom-nav label[for="radio-home"],
        #radio-prof:checked ~ .bottom-nav label[for="radio-prof"] {
            color: #2563eb;
        }
    </style>
</head>
<body>

<input type="radio" name="main_nav" id="radio-home" class="nav-radio" checked>
<input type="radio" name="main_nav" id="radio-prof" class="nav-radio">

<div class="card">
    <div class="top-bar">
        <h2>PocketBoss 💼</h2>
        <button class="lang-btn" onclick="toggleLanguage()" id="btnToggleLang">English</button>
    </div>

    <!-- 1. HOME SCREEN -->
    <div id="screen-home" class="tab-content">
        <!-- இந்த மாத சேமிப்பு + முந்தைய மாதங்கள் சேர்த்து மொத்த இருப்பு -->
        <div class="savings-container">
            <div class="savings-box">
                <div class="box-title" id="lblSavingsTitle">இந்த மாத சேமிப்பு</div>
                <div class="box-amount">₹<span id="valSavings">0</span></div>
                <div class="savings-rate" id="valSavingsRate">0%</div>
            </div>
            <div class="total-box">
                <div class="box-title" id="lblTotalBalanceTitle">மொத்தக் கையிருப்பு</div>
                <div class="box-amount">₹<span id="valTotalBalance">0</span></div>
                <small style="font-size: 10px; opacity: 0.9;" id="lblCarriedTxt">முந்தைய இருப்புடன்</small>
            </div>
        </div>

        <div class="dashboard">
            <div class="dash-card dash-today">
                <small id="lblTodayExp">இன்றைய செலவு</small>
                <h3 style="margin: 5px 0;">₹<span id="valTodayExp">0</span></h3>
            </div>
            <div class="dash-card dash-kadai">
                <small id="lblDebt">மீதமுள்ள கடன்</small>
                <h3 style="margin: 5px 0;">₹<span id="valDebt">0</span></h3>
            </div>
        </div>

        <select id="selCategory"></select>
        <input type="text" id="inpNote" placeholder="சின்ன குறிப்பு (விருப்பப்பட்டால்)">
        <input type="number" id="inpAmount" placeholder="ரூபாய் (₹)">
        <button class="add-btn" onclick="addExpense()" id="btnAddExp">கணக்குல சேர்</button>

        <div class="history-header">
            <h3 style="margin: 0; color: #0f172a;" id="lblHistory">வரலாறு (History)</h3>
            <button class="download-btn" onclick="downloadExcel()" id="btnDownload">📥 எக்ஸெல்</button>
        </div>

        <ul id="listEntries"></ul>
    </div>

    <!-- 2. PROFILE SCREEN -->
    <div id="screen-prof" class="tab-content">
        <h3 style="margin-top: 5px; color: #0f172a;" id="lblProfTitle">சுயவிவரம் (Profile)</h3>
        
        <div class="profile-row">
            <span id="lblUserName">பயனர் பெயர்</span>
            <input type="text" id="inpUserName" placeholder="உங்கள் பெயர்" style="width: 140px; padding: 6px;" oninput="saveUserData()">
        </div>

        <div class="profile-row">
            <span id="lblUserSalary">மாதச் சம்பளம் (₹)</span>
            <input type="number" id="inpSalary" placeholder="0" style="width: 140px; padding: 6px;" oninput="saveUserData()">
        </div>

        <div class="profile-row">
            <span id="lblTotalDebtSetting">மொத்தக் கடன் (₹)</span>
            <input type="number" id="inpBaseDebt" placeholder="0" style="width: 140px; padding: 6px;" oninput="saveUserData()">
        </div>

        <div class="profile-row">
            <span>Version</span>
            <small style="font-weight: bold; color: #64748b;">PocketBoss v1.6</small>
        </div>

        <button class="clear-btn" onclick="clearData()" id="btnClearData">முழு கணக்கையும் அழி (Reset Data)</button>
    </div>
</div>

<div class="bottom-nav">
    <label for="radio-home" class="nav-label-btn">
        <span class="icon">🏠</span>
        <span id="navLblHome">ஹோம்</span>
    </label>
    <label for="radio-prof" class="nav-label-btn">
        <span class="icon">👤</span>
        <span id="navLblProf">சுயவிவரம்</span>
    </label>
</div>

<script>
    const items = [
        { id: "milk", ta: "🥛 பால் & தயிர்", en: "🥛 Milk & Curd", type: "exp" },
        { id: "grocery", ta: "🛒 மளிகை சாமான்", en: "🛒 Groceries", type: "exp" },
        { id: "veg", ta: "🥬 காய் & கனிகள்", en: "🥬 Veg & Fruits", type: "exp" },
        { id: "water", ta: "💧 குடிநீர் கேன்", en: "💧 Drinking Water", type: "exp" },
        { id: "rent", ta: "🏠 வீட்டு வாடகை", en: "🏠 House Rent", type: "exp" },
        { id: "bus", ta: "🚌 பஸ் / ரயில் டிக்கெட்", en: "🚌 Bus / Metro Ticket", type: "exp" },
        { id: "fuel", ta: "⛽ பெட்ரோல் / டீசல்", en: "⛽ Petrol / Fuel", type: "exp" },
        { id: "bike", ta: "🛵 பைக் சர்வீஸ் / பஞ்சர்", en: "🛵 Bike Service / Repair", type: "exp" },
        { id: "tea", ta: "☕ டீ / காபி / ஸ்நாக்ஸ்", en: "☕ Tea / Snacks", type: "exp" },
        { id: "hotel", ta: "🍛 சாப்பாடு / ஹோட்டல்", en: "🍛 Hotel / Food", type: "exp" },
        { id: "recharge", ta: "📱 மொபைல் ரீசார்ஜ் / WiFi", en: "📱 Recharge / Bills", type: "exp" },
        { id: "eb", ta: "💡 கரண்ட் பில் (EB)", en: "💡 Electricity Bill (EB)", type: "exp" },
        { id: "gas", ta: "🎛️ கேஸ் சிலிண்டர்", en: "🎛️ Gas Cylinder", type: "exp" },
        { id: "med", ta: "🏥 மருத்துவம் / மாத்திரை", en: "🏥 Medicine / Hospital", type: "exp" },
        { id: "debt_new", ta: "💳 புதிய கடன் வாங்குதல் (+)", en: "💳 New Debt Taken (+)", type: "debt_add" },
        { id: "debt_repay", ta: "🤝 கடன் அடைப்பு / திரும்ப செலுத்துதல் (-)", en: "🤝 Debt Repaid / Cleared (-)", type: "debt_sub" },
        { id: "other", ta: "📦 மற்ற செலவுகள்", en: "📦 Others", type: "exp" }
    ];

    let currentLang = localStorage.getItem('appLang') || 'ta';

    function toggleLanguage() {
        currentLang = (currentLang === 'ta') ? 'en' : 'ta';
        localStorage.setItem('appLang', currentLang);
        applyLanguage();
        renderApp();
    }

    function applyLanguage() {
        const isTa = (currentLang === 'ta');

        document.getElementById('btnToggleLang').innerText = isTa ? "English" : "தமிழ்";
        document.getElementById('lblSavingsTitle').innerText = isTa ? "இந்த மாத சேமிப்பு" : "Month Savings";
        document.getElementById('lblTotalBalanceTitle').innerText = isTa ? "மொத்தக் கையிருப்பு" : "Total Balance";
        document.getElementById('lblCarriedTxt').innerText = isTa ? "முந்தைய இருப்புடன்" : "With Carryover";
        document.getElementById('lblTodayExp').innerText = isTa ? "இன்றைய செலவு" : "Today's Expense";
        document.getElementById('lblDebt').innerText = isTa ? "மீதமுள்ள கடன்" : "Remaining Debt";
        document.getElementById('inpNote').placeholder = isTa ? "சின்ன குறிப்பு (விருப்பப்பட்டால்)" : "Note (optional)";
        document.getElementById('inpAmount').placeholder = isTa ? "ரூபாய் (₹)" : "Amount (₹)";
        document.getElementById('btnAddExp').innerText = isTa ? "கணக்குல சேர்" : "Add Entry";
        document.getElementById('lblHistory').innerText = isTa ? "வரலாறு (History)" : "History";
        document.getElementById('btnDownload').innerText = isTa ? "📥 எக்ஸெல்" : "📥 Export";

        document.getElementById('lblProfTitle').innerText = isTa ? "சுயவிவரம் (Profile)" : "Profile Settings";
        document.getElementById('lblUserName').innerText = isTa ? "பயனர் பெயர்" : "User Name";
        document.getElementById('lblUserSalary').innerText = isTa ? "மாதச் சம்பளம் (₹)" : "Monthly Salary (₹)";
        document.getElementById('lblTotalDebtSetting').innerText = isTa ? "மொத்தக் கடன் (₹)" : "Total Initial Debt (₹)";
        document.getElementById('btnClearData').innerText = isTa ? "முழு கணக்கையும் அழி (Reset Data)" : "Reset All Data";

        document.getElementById('navLblHome').innerText = isTa ? "ஹோம்" : "Home";
        document.getElementById('navLblProf').innerText = isTa ? "சுயவிவரம்" : "Profile";

        let sel = document.getElementById('selCategory');
        let selectedVal = sel.value || "fuel";
        sel.innerHTML = '';

        items.forEach(it => {
            let label = isTa ? it.ta : it.en;
            let opt = document.createElement('option');
            opt.value = it.id;
            opt.innerText = label;
            if (it.id === selectedVal) opt.selected = true;
            sel.appendChild(opt);
        });
    }

    function getTodayString() {
        let d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
    }

    function getCurrentMonthKey() {
        let d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0');
    }

    function saveUserData() {
        localStorage.setItem('userSalary', parseFloat(document.getElementById('inpSalary').value) || 0);
        localStorage.setItem('baseDebt', parseFloat(document.getElementById('inpBaseDebt').value) || 0);
        localStorage.setItem('userName', document.getElementById('inpUserName').value.trim());
        renderApp();
    }

    function addExpense() {
        let catId = document.getElementById('selCategory').value;
        let note = document.getElementById('inpNote').value.trim();
        let amount = parseFloat(document.getElementById('inpAmount').value);

        if (!amount || amount <= 0) {
            alert(currentLang === 'ta' ? "சரியான தொகையை உள்ளிடவும்!" : "Please enter a valid amount!");
            return;
        }

        let entries = JSON.parse(localStorage.getItem('userExpenses') || "[]");
        let d = new Date();
        let time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        entries.unshift({
            id: Date.now(),
            catId: catId,
            note: note,
            amount: amount,
            day: getTodayString(),
            monthKey: getCurrentMonthKey(),
            time: time
        });

        localStorage.setItem('userExpenses', JSON.stringify(entries));
        document.getElementById('inpNote').value = '';
        document.getElementById('inpAmount').value = '';
        renderApp();
    }

    function deleteItem(id) {
        let entries = JSON.parse(localStorage.getItem('userExpenses') || "[]");
        entries = entries.filter(e => e.id !== id);
        localStorage.setItem('userExpenses', JSON.stringify(entries));
        renderApp();
    }

    function clearData() {
        let msg = (currentLang === 'ta') ? "முழு கணக்குகளையும் அழிக்கவா?" : "Clear all records?";
        if (confirm(msg)) {
            localStorage.removeItem('userExpenses');
            renderApp();
        }
    }

    function downloadExcel() {
        let entries = JSON.parse(localStorage.getItem('userExpenses') || "[]");
        if (entries.length === 0) {
            alert(currentLang === 'ta' ? "பதிவிறக்க எந்த கணக்குகளும் இல்லை!" : "No records to export!");
            return;
        }

        const isTa = (currentLang === 'ta');
        let rows = [isTa ? ["தேதி", "நேரம்", "வகை", "குறிப்பு", "தொகை", "வகைப்பாடு"] : ["Date", "Time", "Category", "Note", "Amount", "Type"]];
        
        entries.forEach(e => {
            let itemObj = items.find(i => i.id === e.catId) || items[items.length - 1];
            let catName = isTa ? itemObj.ta : itemObj.en;
            let typeLabel = "செலவு";
            if (itemObj.type === 'debt_add') typeLabel = "புதிய கடன்";
            if (itemObj.type === 'debt_sub') typeLabel = "கடன் அடைப்பு";
            rows.push([e.day, e.time, catName, e.note || "-", e.amount, typeLabel]);
        });

        let csv = "\uFEFF" + rows.map(r => r.join(",")).join("\r\n");
        let blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `PocketBoss_${getTodayString()}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function renderApp() {
        let entries = JSON.parse(localStorage.getItem('userExpenses') || "[]");
        let salary = parseFloat(localStorage.getItem('userSalary') || 0);
        let baseDebt = parseFloat(localStorage.getItem('baseDebt') || 0);
        
        document.getElementById('inpSalary').value = salary ? salary : '';
        document.getElementById('inpBaseDebt').value = baseDebt ? baseDebt : '';
        document.getElementById('inpUserName').value = localStorage.getItem('userName') || '';

        let todayStr = getTodayString();
        let curMonthKey = getCurrentMonthKey();

        let todayTotal = 0;
        let currentMonthExpense = 0;
        let totalAllExpense = 0;
        let currentDebt = baseDebt;

        // எத்தனை மாதங்கள் செலவு செய்யப்பட்டுள்ளது என்பதைக் கணக்கிடுதல்
        let activeMonths = new Set();
        activeMonths.add(curMonthKey);

        let list = document.getElementById('listEntries');
        list.innerHTML = '';

        entries.forEach(e => {
            let itemObj = items.find(i => i.id === e.catId) || items[items.length - 1];
            let itemMonth = e.monthKey || e.day.substring(0, 7);
            activeMonths.add(itemMonth);

            if (itemObj.type === "exp" || itemObj.type === "debt_sub") {
                totalAllExpense += e.amount;
                if (itemMonth === curMonthKey) {
                    currentMonthExpense += e.amount;
                }
                if (e.day === todayStr) {
                    todayTotal += e.amount;
                }
            }

            if (itemObj.type === "debt_add") {
                currentDebt += e.amount;
            } else if (itemObj.type === "debt_sub") {
                currentDebt -= e.amount;
            }

            let label = (currentLang === 'ta') ? itemObj.ta : itemObj.en;
            let li = document.createElement('li');
            if (itemObj.type === 'debt_add') li.className = 'kadai-item';
            if (itemObj.type === 'debt_sub') li.className = 'repaid-item';

            li.innerHTML = `
                <div>
                    <b>${label}</b> ${e.note ? `<br><small style="color:#64748b;">${e.note}</small>` : ''}
                    <div style="font-size:11px; color:#94a3b8;">${e.day} • ${e.time}</div>
                </div>
                <div style="display:flex; align-items:center;">
                    <b>₹${e.amount}</b>
                    <button class="del-btn" onclick="deleteItem(${e.id})">X</button>
                </div>
            `;
            list.appendChild(li);
        });

        // 1. இன்றைய செலவு & மீதமுள்ள கடன்
        document.getElementById('valTodayExp').innerText = todayTotal;
        document.getElementById('valDebt').innerText = (currentDebt < 0) ? 0 : currentDebt;
        
        // 2. இந்த மாத சேமிப்பு (Current Month Savings)
        let monthSavings = salary - currentMonthExpense;
        document.getElementById('valSavings').innerText = monthSavings;
        let rate = (salary > 0) ? Math.round((monthSavings / salary) * 100) : 0;
        document.getElementById('valSavingsRate').innerText = rate + "%";

        // 3. மொத்தக் கையிருப்பு (Total Accumulated Balance With Carryover)
        let totalEarned = activeMonths.size * salary;
        let totalBalance = totalEarned - totalAllExpense;
        document.getElementById('valTotalBalance').innerText = totalBalance;
    }

    applyLanguage();
    renderApp();
</script>

</body>
</html>
